name: Renderer production checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-core:
    name: Production core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: core-linux
            test_generator: Ninja Multi-Config
          - os: windows-2022
            preset: core-windows
            test_generator: Visual Studio 17 2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Initialize core and test header dependencies
        run: git submodule update --init --depth 1 -- 3rd/serdepp 3rd/json 3rd/nameof 3rd/magic_enum
      - name: Initialize VFS test dependencies
        run: git submodule update --init --recursive --depth 1 -- 3rd/vfspp
      - name: Configure without graphics SDKs or local test sources
        run: cmake --preset ${{ matrix.preset }}
      - name: Build production core libraries
        run: cmake --build --preset ${{ matrix.preset }}-release --parallel 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Configure standalone tests
        run: cmake -S testModule -B build/ci-tests -G "${{ matrix.test_generator }}"
      - name: Build standalone tests
        run: cmake --build build/ci-tests --config Release --parallel 2
      - name: Run standalone tests
        run: ctest --test-dir build/ci-tests -C Release --output-on-failure --no-tests=error

  windows-renderer:
    name: Windows ${{ matrix.backend }} ${{ matrix.configuration }}
    strategy:
      fail-fast: false
      matrix:
        backend: [Vulkan, DX12]
        configuration: [Debug, Release]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Initialize Vulkan and DX12 build dependencies
        run: >-
          git submodule update --init --recursive --depth 1 --
          3rd/ArgParse 3rd/assimp 3rd/fmt 3rd/freetype 3rd/glslang
          3rd/imgui/IconFont 3rd/imgui/imgui 3rd/json 3rd/lua
          3rd/magic_enum 3rd/nameof 3rd/serdepp 3rd/sol 3rd/soloud 3rd/stb 3rd/vfspp
          3rd/SDL3 3rd/SPIRV-Cross 3rd/SPIRV-Reflect 3rd/volk 3rd/Vulkan-Headers 3rd/VMA 3rd/D3D12MA
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked build-host dependencies
        run: |
          python -m pip install uv
          python -m uv sync --locked
      - name: Configure production renderer without local tests
        run: >-
          cmake --preset windows -B build/windows/renderer
          -DUSE_VULKAN=${{ matrix.backend == 'Vulkan' && 'ON' || 'OFF' }} -DUSE_OPENGL=OFF
          -DUSE_DX12=${{ matrix.backend == 'DX12' && 'ON' || 'OFF' }} -DUSE_GPU_DRIVEN=ON
          -DUSE_NETWORK=OFF -DUSE_IKIGAI_SCRIPT=OFF -DENABLE_OPT=OFF -DIKIGAI_BUILD_TEST_MODULE=OFF
      - name: Build the engine
        run: cmake --build build/windows/renderer --config ${{ matrix.configuration }} --target IkigaiEngine --parallel 2
