[project]
name = "ikigai-engine-tools"
version = "0.1.0"
description = "Build and asset tools for IkigaiEngine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi>=2025.1.31",
    "gdown>=5.2",
]

[project.optional-dependencies]
content = ["Pillow==12.0.0"]

[dependency-groups]
tests = [
    "Pillow==12.0.0",
    "jsonschema>=4.23,<5",
    "numpy>=2,<3",
]

[tool.uv]
package = false
default-groups = []
